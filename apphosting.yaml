# Settings to manage and configure a Firebase App Hosting backend.
# https://firebase.google.com/docs/app-hosting/configure

# The command that starts your web app
entrypoint: npm start
# The command that builds your web app
build: npm run build

runConfig:
  # Increase this value to automatically spin up more instances
  # in response to increased traffic.
  maxInstances: 1
  cpu: 1
  memoryMiB: 1024

# Pass environment variables from your .env file to your build and runtime.
# See https://firebase.google.com/docs/app-hosting/configure#env
env:
  - variable: FIREBASE_SERVICE_ACCOUNT
    availability:
      - BUILD
      - RUNTIME
    secret: FIREBASE_SERVICE_ACCOUNT
